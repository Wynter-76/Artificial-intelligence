<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fuzzy Penyiraman Tanaman</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Sistem Penyiraman Tanaman</h1>

        <p class="subtitle">
            Fuzzy Mamdani untuk menentukan lama penyiraman
        </p>

        <form method="POST">

            <div class="form-group">

                <label>
                    Kelembapan Tanah (%)
                </label>

                <input
                    type="number"
                    name="kelembapan"
                    min="0"
                    max="100"
                    step="0.1"
                    placeholder="Contoh: 30"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Suhu Udara (°C)
                </label>

                <input
                    type="number"
                    name="suhu"
                    min="15"
                    max="40"
                    step="0.1"
                    placeholder="Contoh: 32"
                    required
                >

            </div>


            <button type="submit">
                Hitung Penyiraman
            </button>

        </form>


        {% if hasil is not none %}

        <div class="result">

            <h2>Hasil Fuzzy Mamdani</h2>

            <div class="result-item">
                <span>Kelembapan Tanah</span>
                <strong>{{ "%.1f"|format(kelembapan) }}%</strong>
            </div>

            <div class="result-item">
                <span>Suhu Udara</span>
                <strong>{{ "%.1f"|format(suhu) }}°C</strong>
            </div>

            <div class="result-main">

                <span>Lama Penyiraman</span>

                <strong>
                    {{ "%.2f"|format(hasil) }} menit
                </strong>

            </div>

        </div>

        {% endif %}

    </div>

</div>

</body>
</html>
